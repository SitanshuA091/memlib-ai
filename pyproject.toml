[project]
name = "memlib"
version = "0.1.0"
description = "Lightweight persistent memory infrastructure for AI agents"
readme = "README.pypi.md"
requires-python = ">=3.13"

dependencies = [
    "langchain-core",
    "neo4j==6.3.0",
]


[dependency-groups]
test = [
    "langchain-chroma",
    "langchain-groq",
    "langchain-huggingface",
    "python-dotenv",
    "sentence-transformers",
    "pytest",
]


[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
where = ["src"]


[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days"